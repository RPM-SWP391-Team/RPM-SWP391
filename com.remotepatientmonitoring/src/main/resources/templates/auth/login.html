<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - RPM System</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="login-container">
    <div class="login-box">
        <h2>Hệ thống theo dõi bệnh nhân từ xa</h2>
        <h3>Đăng nhập</h3>

        <div th:if="${errorMessage}" class="alert alert-error">
            <p th:text="${errorMessage}"></p>
        </div>

        <div th:if="${logoutMessage}" class="alert alert-success">
            <p th:text="${logoutMessage}"></p>
        </div>

        <form th:action="@{/auth/login}" method="post">
            <div class="form-group">
                <label for="username">Email</label>
                <input type="email" id="username" name="username"
                       placeholder="Nhập email đăng nhập" required/>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password"
                       placeholder="Nhập mật khẩu" required/>
            </div>

            <button type="submit" class="btn-login">Đăng nhập</button>
        </form>

        <div class="register-link">
            <p>Chưa có tài khoản?
                <a th:href="@{/auth/register}">Đăng ký ngay</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
