<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiếp Nhận Bệnh Nhân | RPM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f0f2f5; }
        .navbar-custom { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); }
        .card-custom { border: none; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
        .search-container { background: white; padding: 30px; border-radius: 15px; margin-bottom: 30px; }
        .btn-assign { background: linear-gradient(135deg, #28a745 0%, #218838 100%); color: white; border: none; }
        .btn-assign:hover { transform: scale(1.05); color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-custom py-3 mb-4">
    <div class="container">
        <a href="/doctor/dashboard" class="navbar-brand mb-0 h1 fw-bold text-decoration-none">
            <i class="fa-solid fa-arrow-left me-2"></i>Quay lại Dashboard
        </a>
        <div class="text-white text-end">
            <div class="fw-bold" th:text="${doctor.fullName}">Bác sĩ</div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="search-container shadow-sm">
        <h4 class="fw-bold mb-4"><i class="fa-solid fa-magnifying-glass me-2 text-primary"></i>Tìm kiếm Bệnh nhân mới</h4>
        <div class="input-group mb-3">
            <input type="text" id="keyword" class="form-control form-control-lg" th:maxlength="50" placeholder="Nhập tên hoặc số điện thoại bệnh nhân...">
            <button class="btn btn-primary px-4" onclick="searchPatients()" >Tìm kiếm</button>
        </div>
    </div>

    <div class="card card-custom p-4 bg-white">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>Mã BN</th>
                <th>Họ Tên</th>
                <th>Số Điện Thoại</th>
                <th>Trạng Thái</th>
                <th class="text-center">Thao tác</th>
            </tr>
            </thead>
            <tbody id="resultTable">
            <tr><td colspan="5" class="text-center text-muted py-4">Hãy nhập từ khóa để tìm kiếm bệnh nhân.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script th:inline="javascript">
    const currentDoctorId = /*[[${doctor.id}]]*/ 1;

    function searchPatients() {
        const keyword = document.getElementById("keyword").value;
        if(!keyword) return;

        // Gọi API GET tìm kiếm
        fetch(`/api/doctor/patients/search?keyword=${keyword}`)
            .then(response => response.json())
            .then(data => {
                let html = '';
                if(data.length === 0) {
                    html = '<tr><td colspan="5" class="text-center text-danger py-4">Không tìm thấy bệnh nhân nào khớp!</td></tr>';
                } else {
                    data.forEach(p => {
                        html += `<tr>
                                <td><span class="badge bg-secondary">${p.patientCode || 'N/A'}</span></td>
                                <td class="fw-bold">${p.fullName}</td>
                                <td>${p.phone}</td>
                                <td><span class="badge ${p.status === 'NEW' ? 'bg-warning text-dark' : 'bg-success'}">${p.status}</span></td>
                                <td class="text-center">
                                    <button class="btn btn-assign btn-sm px-3 rounded-pill" onclick="assignPatient(${p.id})">
                                        <i class="fa-solid fa-check me-1"></i>Tiếp nhận
                                    </button>
                                </td>
                            </tr>`;
                    });
                }
                document.getElementById("resultTable").innerHTML = html;
            }).catch(err => console.error("Lỗi tìm kiếm:", err));
    }

    function assignPatient(patientId) {
        // Giả lập ID hồ sơ bệnh lý mặc định là 1
        const requestData = { patientId: patientId, doctorId: currentDoctorId, diseaseProfileId: 1 };

        // Gọi API POST tiếp nhận
        fetch('/api/doctor/patients/assign', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestData)
        })
            .then(response => response.text())
            .then(message => {
                alert("✅ " + message);
                searchPatients(); // Load lại bảng sau khi tiếp nhận thành công
            }).catch(error => alert("❌ Có lỗi xảy ra: " + error));
    }
</script>
</body>
</html>
