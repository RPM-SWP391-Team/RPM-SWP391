<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu Đồ Tiến Triển Sức Khỏe</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding-bottom: 50px;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card-custom {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .card-header-custom {
            background-color: #ffffff;
            border-bottom: 1.5px solid #f1f3f5;
            padding: 20px 25px;
        }
        .card-body-custom {
            padding: 25px;
        }
        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar navbar-dark navbar-custom py-3 mb-5">
        <div class="container">
            <a href="/patient/dashboard" class="navbar-brand mb-0 h1 text-decoration-none">
                <i class="fa-solid fa-chevron-left me-2 small"></i>Quay lại Dashboard
            </a>
            <span class="navbar-text text-white fw-semibold">
                Báo cáo tiến triển: <span th:text="${patient.fullName}">Nguyễn Văn A</span>
            </span>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex align-items-center justify-content-between">
                    <h2 class="fw-bold mb-0">
                        <i class="fa-solid fa-chart-line text-primary me-2"></i>Biểu Đồ Xu Hướng Sức Khỏe
                    </h2>
                    <span class="badge bg-primary px-3 py-2 rounded-pill">7 ngày gần nhất</span>
                </div>
                <p class="text-muted mt-2">Biểu đồ biểu diễn các chỉ số đo huyết áp và đường huyết đã ghi nhận trong tuần qua.</p>
            </div>
        </div>

        <div class="row">
            
            <!-- Chart 1: Blood Pressure Chart -->
            <div class="col-lg-6">
                <div class="card card-custom">
                    <div class="card-header-custom d-flex align-items-center">
                        <i class="fa-solid fa-heartpulse text-danger fa-xl me-2"></i>
                        <h4 class="mb-0 fw-bold">Biểu Đồ Huyết Áp</h4>
                    </div>
                    <div class="card-body-custom">
                        <div class="chart-container">
                            <canvas id="bpChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Chart 2: Glucose Level Chart -->
            <div class="col-lg-6">
                <div class="card card-custom">
                    <div class="card-header-custom d-flex align-items-center">
                        <i class="fa-solid fa-droplet text-info fa-xl me-2"></i>
                        <h4 class="mb-0 fw-bold">Biểu Đồ Đường Huyết</h4>
                    </div>
                    <div class="card-body-custom">
                        <div class="chart-container">
                            <canvas id="glucoseChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Render Charts Script -->
    <script th:inline="javascript">
        // Injecting and parsing Thymeleaf model JSON data directly
        const dates = [(${datesJson})];
        const systolic = [(${systolicJson})];
        const diastolic = [(${diastolicJson})];
        const glucose = [(${glucoseJson})];

        // 1. Blood Pressure Chart
        const bpCtx = document.getElementById('bpChart').getContext('2d');
        new Chart(bpCtx, {
            type: 'line',
            data: {
                labels: dates,
                datasets: [
                    {
                        label: 'Huyết áp tâm thu (Systolic)',
                        data: systolic,
                        borderColor: '#dc3545',
                        backgroundColor: 'rgba(220, 53, 69, 0.1)',
                        borderWidth: 3,
                        tension: 0.3,
                        fill: true
                    },
                    {
                        label: 'Huyết áp tâm trương (Diastolic)',
                        data: diastolic,
                        borderColor: '#2a5298',
                        backgroundColor: 'rgba(42, 82, 152, 0.1)',
                        borderWidth: 3,
                        tension: 0.3,
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        title: {
                            display: true,
                            text: 'Chỉ số (mmHg)'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Ngày đo & Khung giờ'
                        }
                    }
                }
            }
        });

        // 2. Glucose Level Chart
        const glucoseCtx = document.getElementById('glucoseChart').getContext('2d');
        new Chart(glucoseCtx, {
            type: 'line',
            data: {
                labels: dates,
                datasets: [
                    {
                        label: 'Chỉ số đường huyết (Glucose)',
                        data: glucose,
                        borderColor: '#0dcaf0',
                        backgroundColor: 'rgba(13, 202, 240, 0.1)',
                        borderWidth: 3,
                        tension: 0.3,
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        title: {
                            display: true,
                            text: 'Chỉ số (mg/dL)'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Ngày đo & Khung giờ'
                        }
                    }
                }
            }
        });
    </script>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="/patient/dashboard" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Trang chủ</span>
        </a>
        <a href="/patient/adherence" class="nav-item">
            <i class="fa-solid fa-pills"></i>
            <span>Thuốc uống</span>
        </a>
        <a href="/patient/appointments" class="nav-item">
            <i class="fa-solid fa-calendar-check"></i>
            <span>Nhật ký</span>
        </a>
        <a href="/patient/log" class="nav-item fab-item">
            <div class="fab-btn">
                <i class="fa-solid fa-plus"></i>
            </div>
        </a>
        <a href="/patient/nutrition" class="nav-item">
            <i class="fa-solid fa-utensils"></i>
            <span>Dinh dưỡng</span>
        </a>
        <a href="/patient/exercise" class="nav-item">
            <i class="fa-solid fa-person-running"></i>
            <span>Tập luyện</span>
        </a>
        <a href="/patient/progress" class="nav-item">
            <i class="fa-solid fa-chart-line"></i>
            <span>Hồ sơ</span>
        </a>
    </div>

    <style>
        /* Bottom Navigation Bar Styles */
        body {
            padding-bottom: 90px !important;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 75px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            padding: 0 10px;
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
            height: 100%;
        }

        .bottom-nav .nav-item i {
            font-size: 1.25rem;
            margin-bottom: 4px;
            transition: transform 0.2s ease;
        }

        .bottom-nav .nav-item span {
            font-size: 0.7rem;
            white-space: nowrap;
        }

        .bottom-nav .nav-item:hover,
        .bottom-nav .nav-item.active {
            color: #2a5298;
        }

        .bottom-nav .nav-item.active i {
            transform: translateY(-2px);
            color: #2a5298;
        }

        /* Floating Action Button (FAB) for the central plus item */
        .bottom-nav .fab-item {
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }

        .bottom-nav .fab-btn {
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(42, 82, 152, 0.4);
            transform: translateY(-15px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 3px solid #ffffff;
        }

        .bottom-nav .fab-btn i {
            font-size: 1.5rem;
            margin-bottom: 0;
            color: #ffffff;
            transition: transform 0.3s ease;
        }

        .bottom-nav .fab-item:hover .fab-btn {
            transform: translateY(-18px) scale(1.05);
            box-shadow: 0 6px 20px rgba(42, 82, 152, 0.5);
        }

        .bottom-nav .fab-item:hover .fab-btn i {
            transform: rotate(90deg);
        }

        .bottom-nav .fab-item.active .fab-btn {
            background: linear-gradient(135deg, #ff9900 0%, #ff5500 100%);
            box-shadow: 0 4px 15px rgba(255, 85, 0, 0.4);
        }

        /* Responsive adjustment for extra small screens */
        @media (max-width: 480px) {
            .bottom-nav .nav-item span {
                display: none;
            }
            .bottom-nav .nav-item i {
                font-size: 1.4rem;
                margin-bottom: 0;
            }
            .bottom-nav .fab-btn {
                width: 50px;
                height: 50px;
                transform: translateY(-12px);
            }
            .bottom-nav .fab-item:hover .fab-btn {
                transform: translateY(-15px) scale(1.05);
            }
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const currentPath = window.location.pathname;
            document.querySelectorAll(".bottom-nav .nav-item").forEach(item => {
                const href = item.getAttribute("href");
                if (currentPath === href || (href === "/patient/appointments" && currentPath === "/patient/request-change")) {
                    item.classList.add("active");
                }
            });
        });
    </script>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bundle.min.js"></script>
</body>
</html>
