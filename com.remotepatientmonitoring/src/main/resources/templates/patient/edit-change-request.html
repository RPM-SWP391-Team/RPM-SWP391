<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{patient/fragments :: header-links('Chỉnh Sửa Yêu Cầu Thay Đổi')}"></head>
<body>
    <nav th:replace="~{patient/fragments :: top-nav}"></nav>

    <!-- Form Container -->
    <div class="container my-5" style="padding-bottom: 120px;">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                
                <!-- Error Alert -->
                <div th:if="${param.editError}" class="alert alert-danger alert-dismissible fade show mb-4 shadow-sm" role="alert" style="border-radius: var(--radius-md);">
                    <i class="fa-solid fa-circle-exclamation me-2"></i>
                    <span th:if="${param.editError[0] == 'emptyReason'}">Mô tả lý do thay đổi không được để trống.</span>
                    <span th:if="${param.editError[0] == 'reasonTooLong'}">Mô tả lý do thay đổi không được vượt quá 500 ký tự.</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card shadow-sm border-0" style="border-radius: var(--radius-lg); overflow: hidden;">
                    <!-- Header -->
                    <div class="p-4 text-white" style="background: var(--gradient-primary);">
                        <h2 class="fw-bold mb-1"><i class="fa-solid fa-pen-to-square me-2 text-warning"></i>Chỉnh Sửa Yêu Cầu</h2>
                        <p class="mb-0 text-white-50 small">Cập nhật nội dung yêu cầu thay đổi gửi tới bác sĩ</p>
                    </div>
                    
                    <!-- Form Body -->
                    <div class="card-body p-4 bg-white">
                        <form th:action="@{/patient/request-change/update/{id}(id=${changeRequest.id})}" method="POST">
                            
                            <!-- Request Type -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold text-muted mb-2"><i class="fa-solid fa-list-check me-2 text-primary"></i>Loại yêu cầu thay đổi</label>
                                <select name="requestType" class="form-select" required style="border-radius: var(--radius-sm); padding: 10px 14px;">
                                    <option value="TREATMENT_PLAN" th:selected="${changeRequest.requestType == 'TREATMENT_PLAN'}">Thay đổi phác đồ điều trị (Treatment Plan)</option>
                                    <option value="SCHEDULE" th:selected="${changeRequest.requestType == 'SCHEDULE'}">Thay đổi lịch sinh hoạt (Schedule)</option>
                                    <option value="DIET" th:selected="${changeRequest.requestType == 'DIET'}">Thay đổi quy tắc dinh dưỡng (Diet)</option>
                                    <option value="APPOINTMENT" th:selected="${changeRequest.requestType == 'APPOINTMENT'}">Thay đổi lịch hẹn khám (Appointment)</option>
                                </select>
                                <div class="form-text small text-muted">Bác sĩ sẽ xem xét loại yêu cầu cụ thể này để điều chỉnh thích hợp.</div>
                            </div>

                            <!-- Reason text area -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold text-muted mb-2"><i class="fa-regular fa-comment-dots me-2 text-primary"></i>Mô tả lý do thay đổi</label>
                                <textarea name="patientReason" class="form-control" rows="6" placeholder="Mô tả cụ thể lý do..." required maxlength="500" style="border-radius: var(--radius-sm); resize: none; padding: 10px 14px;" th:text="${changeRequest.patientReason}"></textarea>
                                <div class="form-text small text-muted">Tối đa 500 ký tự.</div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="row g-3 mt-4">
                                <div class="col-6">
                                    <a href="/patient/appointments" class="btn btn-secondary w-100 py-2.5 fw-bold" style="border-radius: var(--radius-sm); background-color: #6c757d; border-color: #6c757d;">Hủy bỏ</a>
                                </div>
                                <div class="col-6">
                                    <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold" style="border-radius: var(--radius-sm); background: var(--gradient-primary); border: none;">Lưu Thay Đổi</button>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div th:replace="~{patient/fragments :: bottom-nav}"></div>

    <th:block th:replace="~{patient/fragments :: footer-scripts}"></th:block>
</body>
</html>
