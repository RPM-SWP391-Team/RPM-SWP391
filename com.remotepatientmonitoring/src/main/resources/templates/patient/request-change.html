<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Yêu Cầu Thay Đổi</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/patient.css">
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar navbar-dark navbar-custom py-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="/patient/appointments" class="navbar-brand mb-0 h1 text-decoration-none">
                <i class="fa-solid fa-chevron-left me-2 small"></i>Lịch hẹn & Yêu cầu
            </a>
            
            <div class="d-flex align-items-center gap-3 text-white">
                <div class="d-flex align-items-center gap-2">
                    <i class="fa-regular fa-user-circle fs-5"></i>
                    <span class="fw-semibold" th:text="${patient.fullName}">Tên bệnh nhân</span>
                </div>
                <form th:action="@{/auth/logout}" method="post" class="m-0 p-0">
                    <button type="submit" class="btn btn-sm btn-outline-light d-flex align-items-center gap-2" style="border-radius: var(--radius-sm); border: none; background: rgba(255,255,255,0.1);">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        <span class="d-none d-sm-inline">Đăng xuất</span>
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Form Container -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                
                <div class="card card-form">
                    <div class="form-header">
                        <h2 class="fw-bold mb-1"><i class="fa-solid fa-paper-plane me-2 text-warning"></i>Yêu Cầu Thay Đổi</h2>
                        <p class="mb-0 text-white-50 small">Gửi yêu cầu thay đổi phác đồ hoặc lịch sinh hoạt tới bác sĩ</p>
                    </div>
                    
                    <div class="form-body">
                        <form th:action="@{/patient/request-change}" th:object="${changeRequest}" method="POST">
                            
                            <!-- Request Type -->
                            <div class="mb-4">
                                <label class="form-label-custom"><i class="fa-solid fa-list-check"></i>Loại yêu cầu thay đổi</label>
                                <select th:field="*{requestType}" class="form-select form-control-custom" required>
                                    <option value="TREATMENT_PLAN">Thay đổi phác đồ điều trị (Treatment Plan)</option>
                                    <option value="SCHEDULE">Thay đổi lịch sinh hoạt (Schedule)</option>
                                    <option value="DIET">Thay đổi quy tắc dinh dưỡng (Diet)</option>
                                    <option value="APPOINTMENT">Thay đổi lịch hẹn khám (Appointment)</option>
                                </select>
                                <div class="form-text small text-muted">Bác sĩ sẽ xem xét loại yêu cầu cụ thể này để điều chỉnh thích hợp.</div>
                            </div>

                            <!-- Reason text area -->
                            <div class="mb-4">
                                <label class="form-label-custom"><i class="fa-regular fa-comment-dots"></i>Mô tả lý do thay đổi</label>
                                <textarea th:field="*{patientReason}" class="form-control form-control-custom" rows="6" placeholder="Mô tả cụ thể lý do tại sao bạn muốn thay đổi (Ví dụ: thuốc gây mệt mỏi, muốn dời giờ đi bộ, thức ăn không phù hợp...)" required></textarea>
                                <div class="form-text small text-muted">Nội dung này được gửi trực tiếp và nguyên văn tới bác sĩ điều trị của bạn.</div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="row g-3 mt-4">
                                <div class="col-6">
                                    <a href="/patient/appointments" class="btn btn-cancel">Hủy bỏ</a>
                                </div>
                                <div class="col-6">
                                    <button type="submit" class="btn btn-submit">Gửi Yêu Cầu</button>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bundle.min.js"></script>
    <script src="/js/patient.js"></script>
</body>
</html>
