<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Yêu Cầu Thay Đổi</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding-bottom: 50px;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card-form {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            background-color: #ffffff;
            overflow: hidden;
        }
        .form-header {
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
            color: #fff;
            padding: 25px;
            text-align: center;
        }
        .form-body {
            padding: 30px 20px;
        }
        @media(min-width: 576px) {
            .form-body {
                padding: 40px;
            }
        }
        .form-label-custom {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        .form-label-custom i {
            width: 24px;
            color: #2a5298;
        }
        .form-control-custom {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1.5px solid #dee2e6;
            transition: all 0.2s;
            font-size: 1rem;
        }
        .form-control-custom:focus {
            border-color: #2a5298;
            box-shadow: 0 0 0 0.25rem rgba(42, 82, 152, 0.15);
        }
        .btn-submit {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 14px;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.3);
            transition: all 0.3s;
            width: 100%;
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 60, 114, 0.5);
        }
        .btn-cancel {
            border-radius: 50px;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            border: 1.5px solid #6c757d;
            color: #6c757d;
            background-color: transparent;
            transition: all 0.2s;
        }
        .btn-cancel:hover {
            background-color: #6c757d;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar navbar-dark navbar-custom py-3 mb-4">
        <div class="container">
            <a href="/patient/appointments" class="navbar-brand mb-0 h1 text-decoration-none">
                <i class="fa-solid fa-chevron-left me-2 small"></i>Lịch hẹn & Yêu cầu
            </a>
        </div>
    </nav>

    <!-- Form Container -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                
                <div class="card card-form">
                    <div class="form-header">
                        <h2 class="fw-bold mb-1"><i class="fa-solid fa-paper-plane me-2 text-warning"></i>Yêu Cầu Thay Đổi</h2>
                        <p class="mb-0 text-white-50 small">Gửi yêu cầu thay đổi phác đồ hoặc lịch sinh hoạt tới bác sĩ</p>
                    </div>
                    
                    <div class="form-body">
                        <form th:action="@{/patient/request-change}" th:object="${changeRequest}" method="POST">
                            
                            <!-- Request Type -->
                            <div class="mb-4">
                                <label class="form-label-custom"><i class="fa-solid fa-list-check"></i>Loại yêu cầu thay đổi</label>
                                <select th:field="*{requestType}" class="form-select form-control-custom" required>
                                    <option value="TREATMENT_PLAN">Thay đổi phác đồ điều trị (Treatment Plan)</option>
                                    <option value="SCHEDULE">Thay đổi lịch sinh hoạt (Schedule)</option>
                                    <option value="DIET">Thay đổi quy tắc dinh dưỡng (Diet)</option>
                                    <option value="APPOINTMENT">Thay đổi lịch hẹn khám (Appointment)</option>
                                </select>
                                <div class="form-text small text-muted">Bác sĩ sẽ xem xét loại yêu cầu cụ thể này để điều chỉnh thích hợp.</div>
                            </div>

                            <!-- Reason text area -->
                            <div class="mb-4">
                                <label class="form-label-custom"><i class="fa-regular fa-comment-dots"></i>Mô tả lý do thay đổi</label>
                                <textarea th:field="*{patientReason}" class="form-control form-control-custom" rows="6" placeholder="Mô tả cụ thể lý do tại sao bạn muốn thay đổi (Ví dụ: thuốc gây mệt mỏi, muốn dời giờ đi bộ, thức ăn không phù hợp...)" required></textarea>
                                <div class="form-text small text-muted">Nội dung này được gửi trực tiếp và nguyên văn tới bác sĩ điều trị của bạn.</div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="row g-3 mt-4">
                                <div class="col-6">
                                    <a href="/patient/appointments" class="btn btn-cancel">Hủy bỏ</a>
                                </div>
                                <div class="col-6">
                                    <button type="submit" class="btn btn-submit">Gửi Yêu Cầu</button>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bundle.min.js"></script>
</body>
</html>
