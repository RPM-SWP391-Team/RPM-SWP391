<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <th:block th:replace="~{patient/fragments :: header-links('Kiểm tra kiến thức')}"></th:block>
</head>
<body>

    <!-- Header -->
    <div class="quiz-header">
        <div class="container position-relative text-center">
            <a href="/patient/handbook" class="btn btn-sm btn-outline-light position-absolute start-0 top-50 translate-middle-y ms-3 rounded-pill px-3 fs-08">
                <i class="fa-solid fa-chevron-left me-1"></i>Quay lại cẩm nang
            </a>
            <h5 class="fw-bold mb-1"><i class="fa-solid fa-graduation-cap me-2"></i>TRẮC NGHIỆM KIẾN THỨC</h5>
            <p class="small text-white-50 mb-0">Ôn luyện kiến thức xử lý tăng/hạ đường huyết và huyết áp</p>
        </div>
    </div>

    <!-- Content -->
    <div class="container py-4 pb-120">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">

                <!-- Result Card -->
                <div th:if="${isSubmitted}" class="card border-0 shadow-sm p-4 text-center mb-4 bg-white custom-style-65">
                    <div class="score-circle">
                        <span class="fs-2 fw-bold text-success" th:text="${score + '/' + questions.size()}">20/20</span>
                        <small class="text-muted custom-style-133">ĐÚNG</small>
                    </div>
                    <h5 class="fw-bold text-dark mb-2" th:text="${score == questions.size() ? 'Xuất sắc!' : (score >= (questions.size() * 3 / 5) ? 'Kết quả rất tốt!' : 'Cần cố gắng thêm!')}">Kết quả</h5>
                    <p class="text-secondary small mb-4 px-2 custom-style-134"
                       th:text="${score == questions.size() ? 'Bạn nắm vững 100% kiến thức tự bảo vệ và chăm sóc sức khỏe.' : (score >= (questions.size() * 3 / 5) ? 'Bạn có kiến thức tương đối tốt. Hãy đọc thêm cẩm nang để xử trí hoàn hảo hơn.' : 'Bạn nên đọc lại cẩm nang hướng dẫn để có thể xử trí an toàn khi gặp sự cố.')}">
                    </p>
                    <div class="d-flex gap-2">
                        <a href="/patient/quiz" class="btn btn-success flex-grow-1 py-2.5 rounded-pill fw-bold text-decoration-none shadow-sm custom-style-74">
                            <i class="fa-solid fa-rotate-right me-1"></i> Làm lại bài trắc nghiệm
                        </a>
                        <a href="/patient/dashboard" class="btn btn-outline-secondary px-4 py-2.5 rounded-pill fw-bold text-decoration-none custom-style-74">
                            Về trang chủ
                        </a>
                    </div>
                </div>

                <form th:action="@{/patient/quiz/submit}" method="POST">
                    
                    <!-- Questions list -->
                    <div th:each="q, stat : ${questions}" class="question-card">
                        <input type="hidden" name="questionIds" th:value="${q.id}" />
                        
                        <div class="question-header d-flex justify-content-between align-items-center">
                            <span class="text-primary" th:text="${'Câu ' + (stat.index + 1)}">Câu 1</span>
                            
                            <!-- Result Icons -->
                            <span th:if="${isSubmitted}">
                                <i th:if="${userAnswers.get(q.id) == q.correctOptionIndex}" class="fa-solid fa-circle-check text-success fa-lg"></i>
                                <i th:if="${userAnswers.get(q.id) != q.correctOptionIndex}" class="fa-solid fa-circle-xmark text-danger fa-lg"></i>
                            </span>
                        </div>
                        
                        <div class="card-body p-4">
                            <h6 class="fw-bold text-dark mb-3 lh-base" th:text="${q.question}">Câu hỏi</h6>
                            
                            <!-- Option Items -->
                            <div th:each="opt, oStat : ${q.options}">
                                
                                <!-- Normal Mode (Not Submitted) -->
                                <div th:if="${!isSubmitted}">
                                    <input type="radio" 
                                           th:id="${'q_' + q.id + '_opt_' + oStat.index}" 
                                           th:name="${'answer_' + q.id}" 
                                           th:value="${oStat.index}"
                                           class="option-input" />
                                    <label th:for="${'q_' + q.id + '_opt_' + oStat.index}" class="option-label">
                                        <span class="option-badge" th:text="${oStat.index == 0 ? 'A' : (oStat.index == 1 ? 'B' : (oStat.index == 2 ? 'C' : 'D'))}">A</span>
                                        <span th:text="${opt.substring(3).trim()}">Đáp án</span>
                                    </label>
                                </div>
                                
                                <!-- Result Mode (Submitted) -->
                                <div th:if="${isSubmitted}">
                                    <div class="option-label"
                                         th:classappend="${oStat.index == q.correctOptionIndex ? 'option-correct' : (oStat.index == userAnswers.get(q.id) ? 'option-wrong' : '')}"
                                         class="custom-style-135">
                                        <span class="option-badge" th:text="${oStat.index == 0 ? 'A' : (oStat.index == 1 ? 'B' : (oStat.index == 2 ? 'C' : 'D'))}">A</span>
                                        <span th:text="${opt.substring(3).trim()}">Đáp án</span>
                                        
                                        <!-- Indicators -->
                                        <span th:if="${oStat.index == q.correctOptionIndex}" class="ms-auto text-success small fw-bold">
                                            <i class="fa-solid fa-check me-1"></i>Đáp án đúng
                                        </span>
                                        <span th:if="${oStat.index == userAnswers.get(q.id) && oStat.index != q.correctOptionIndex}" class="ms-auto text-danger small fw-bold">
                                            <i class="fa-solid fa-xmark me-1"></i>Bạn chọn
                                        </span>
                                    </div>
                                </div>
                                
                            </div>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button th:if="${!isSubmitted}" type="submit" class="btn-submit mt-2 mb-5">
                        <i class="fa-solid fa-paper-plane me-1"></i> Nộp bài và chấm điểm
                    </button>
                    
                </form>

            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div th:replace="~{patient/fragments :: bottom-nav}"></div>

    <!-- Footer JavaScript Scripts -->
    <th:block th:replace="~{patient/fragments :: footer-scripts}"></th:block>

</body>
</html>
