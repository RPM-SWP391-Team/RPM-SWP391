<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập Liệu Sức Khỏe</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding-bottom: 50px;
        }
        .navbar-custom {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card-form {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            background-color: #ffffff;
            overflow: hidden;
        }
        .form-header {
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
            color: #fff;
            padding: 25px;
            text-align: center;
        }
        .form-body {
            padding: 30px 20px;
        }
        @media(min-width: 576px) {
            .form-body {
                padding: 40px;
            }
        }
        .form-label-custom {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        .form-label-custom i {
            width: 24px;
            color: #2a5298;
        }
        .form-control-custom {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1.5px solid #dee2e6;
            transition: all 0.2s;
            font-size: 1rem;
        }
        .form-control-custom:focus {
            border-color: #2a5298;
            box-shadow: 0 0 0 0.25rem rgba(42, 82, 152, 0.15);
        }
        .form-check-custom {
            padding: 15px;
            border-radius: 12px;
            background-color: #f8f9fa;
            border: 1.5px solid #dee2e6;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            cursor: pointer;
        }
        .form-check-custom:hover {
            border-color: #2a5298;
            background-color: #f1f3f5;
        }
        .form-check-input {
            width: 1.6em;
            height: 1.6em;
            margin-left: 0;
            cursor: pointer;
        }
        .btn-submit {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 14px;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.3);
            transition: all 0.3s;
            width: 100%;
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 60, 114, 0.5);
        }
        .btn-cancel {
            border-radius: 50px;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            border: 1.5px solid #6c757d;
            color: #6c757d;
            background-color: transparent;
            transition: all 0.2s;
        }
        .btn-cancel:hover {
            background-color: #6c757d;
            color: #fff;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2a5298;
            margin-top: 25px;
            margin-bottom: 15px;
            border-bottom: 2px solid #eef2f3;
            padding-bottom: 8px;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar navbar-dark navbar-custom py-3 mb-4">
        <div class="container">
            <a href="/patient/dashboard" class="navbar-brand mb-0 h1 text-decoration-none">
                <i class="fa-solid fa-chevron-left me-2 small"></i>Quay lại Dashboard
            </a>
        </div>
    </nav>

    <!-- Form Container -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                
                <div class="card card-form">
                    <div class="form-header">
                        <h2 class="fw-bold mb-1"><i class="fa-solid fa-heart-pulse me-2 text-warning"></i>Nhập Nhật Ký Sức Khỏe</h2>
                        <p class="mb-0 text-white-50 small">Theo dõi sức khỏe hàng ngày để nhận hướng dẫn tốt nhất</p>
                    </div>
                    
                    <div class="form-body">
                        <form th:action="@{/patient/log}" th:object="${healthLog}" method="POST">
                            
                            <!-- Log Type Selection -->
                            <div class="mb-4">
                                <label class="form-label-custom"><i class="fa-regular fa-clock"></i>Thời điểm đo</label>
                                <select th:field="*{logType}" class="form-select form-control-custom" required>
                                    <option value="MORNING">Buổi Sáng (Morning)</option>
                                    <option value="EVENING">Buổi Tối (Evening)</option>
                                    <option value="RANDOM">Đo Ngẫu Nhiên (Random)</option>
                                </select>
                            </div>

                            <!-- Section: Blood Pressure & Heart Rate -->
                            <div class="section-title">Huyết áp & Nhịp tim</div>
                            
                            <div class="row g-3">
                                <div class="col-6 mb-3">
                                    <label class="form-label-custom"><i class="fa-solid fa-gauge-high"></i>Tâm thu</label>
                                    <input type="number" th:field="*{systolicBp}" class="form-control form-control-custom" placeholder="Ví dụ: 120" min="50" max="300">
                                    <div class="form-text small text-muted">Systolic (mmHg)</div>
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label-custom"><i class="fa-solid fa-gauge-simple"></i>Tâm trương</label>
                                    <input type="number" th:field="*{diastolicBp}" class="form-control form-control-custom" placeholder="Ví dụ: 80" min="30" max="200">
                                    <div class="form-text small text-muted">Diastolic (mmHg)</div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label-custom"><i class="fa-solid fa-heartbeat"></i>Nhịp tim</label>
                                <input type="number" th:field="*{heartRate}" class="form-control form-control-custom" placeholder="Nhịp tim (lần/phút)" min="20" max="300">
                            </div>

                            <!-- Section: Glucose Level -->
                            <div class="section-title">Chỉ số Đường huyết</div>
                            
                            <div class="mb-4">
                                <label class="form-label-custom"><i class="fa-solid fa-droplet"></i>Đường huyết (Glucose)</label>
                                <input type="number" step="0.1" th:field="*{glucoseLevel}" class="form-control form-control-custom" placeholder="Ví dụ: 95.5" min="10" max="600">
                                <div class="form-text small text-muted">Đơn vị: mg/dL (khoảng bình thường: 70 - 130)</div>
                            </div>

                            <!-- Section: Adherence -->
                            <div class="section-title">Tuân thủ điều trị</div>

                            <!-- Medication taken check -->
                            <label class="form-check-custom" for="isMedicationTaken">
                                <span><i class="fa-solid fa-prescription-bottle-medication me-2 text-danger"></i>Đã uống đủ thuốc</span>
                                <input class="form-check-input" type="checkbox" th:field="*{isMedicationTaken}" id="isMedicationTaken">
                            </label>

                            <!-- Water intake check -->
                            <label class="form-check-custom" for="isWaterIntakeDone">
                                <span><i class="fa-solid fa-glass-water me-2 text-primary"></i>Đã uống đủ nước</span>
                                <input class="form-check-input" type="checkbox" th:field="*{isWaterIntakeDone}" id="isWaterIntakeDone">
                            </label>

                            <!-- Section: Notes -->
                            <div class="section-title">Ghi chú & Triệu chứng</div>
                            
                            <div class="mb-4">
                                <label class="form-label-custom"><i class="fa-regular fa-comment-dots"></i>Ghi chú của bạn</label>
                                <textarea th:field="*{patientNotes}" class="form-control form-control-custom" rows="3" placeholder="Ví dụ: Cảm thấy mệt mỏi, đau đầu nhẹ..."></textarea>
                            </div>

                            <!-- Action Buttons -->
                            <div class="row g-3 mt-4">
                                <div class="col-6">
                                    <a href="/patient/dashboard" class="btn btn-cancel">Hủy bỏ</a>
                                </div>
                                <div class="col-6">
                                    <button type="submit" class="btn btn-submit">Lưu Nhật Ký</button>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bundle.min.js"></script>
</body>
</html>
