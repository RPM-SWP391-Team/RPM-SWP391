<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lịch Hẹn Khám</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/patient.css">
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar navbar-dark navbar-custom py-3 mb-4">
        <div class="container">
            <a href="/patient/appointments" class="navbar-brand mb-0 h1 text-decoration-none">
                <i class="fa-solid fa-chevron-left me-2 small"></i>Lịch hẹn & Yêu cầu
            </a>
        </div>
    </nav>

    <!-- Form Container -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                
                <div class="card card-form">
                    <div class="form-header bg-primary">
                        <h2 class="fw-bold mb-1 text-white"><i class="fa-solid fa-calendar-plus me-2"></i>Đặt Lịch Hẹn Khám</h2>
                        <p class="mb-0 text-white-50 small">Đăng ký lịch hẹn khám sức khỏe định kỳ hoặc khẩn cấp với bác sĩ</p>
                    </div>
                    
                    <div class="form-body p-4 bg-white" style="border-radius: 0 0 var(--radius-lg) var(--radius-lg); box-shadow: var(--shadow-md);">
                        <form th:action="@{/patient/book-appointment}" method="POST">
                            
                            <!-- Appointment Time -->
                            <div class="mb-4">
                                <label class="form-label small fw-semibold text-muted d-block mb-2"><i class="fa-solid fa-clock me-2 text-primary"></i>Thời gian khám mong muốn</label>
                                <input type="datetime-local" name="appointmentTime" class="form-control" required style="border-radius: var(--radius-sm);">
                            </div>

                            <!-- Appointment Type -->
                            <div class="mb-4">
                                <label class="form-label small fw-semibold text-muted d-block mb-2"><i class="fa-solid fa-list-check me-2 text-primary"></i>Loại lịch hẹn</label>
                                <select name="appointmentType" class="form-select" required style="border-radius: var(--radius-sm);">
                                    <option value="CHECKUP" selected>Khám định kỳ (CHECKUP)</option>
                                    <option value="CONSULTATION">Tư vấn y khoa (CONSULTATION)</option>
                                    <option value="EMERGENCY">Khẩn cấp (EMERGENCY)</option>
                                </select>
                            </div>

                            <!-- Reason text area -->
                            <div class="mb-4">
                                <label class="form-label small fw-semibold text-muted d-block mb-2"><i class="fa-regular fa-comment-dots me-2 text-primary"></i>Lý do đăng ký khám</label>
                                <textarea name="patientRequestReason" class="form-control" rows="5" placeholder="Nhập lý do chi tiết của bạn..." required style="border-radius: var(--radius-sm); resize: none;"></textarea>
                            </div>

                            <!-- Action Buttons -->
                            <div class="row g-3 mt-4">
                                <div class="col-6">
                                    <a href="/patient/appointments" class="btn btn-secondary w-100 py-2" style="border-radius: var(--radius-sm);">Hủy bỏ</a>
                                </div>
                                <div class="col-6">
                                    <button type="submit" class="btn btn-primary w-100 py-2" style="border-radius: var(--radius-sm);">Gửi Yêu Cầu</button>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bundle.min.js"></script>
    <script src="/js/patient.js"></script>
</body>
</html>
